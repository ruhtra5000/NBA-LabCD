
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Projeto de Ciência de Dados{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header class="navbar">
        <div class="navbar-container">

            <a href="{{ url_for('inicio') }}" class="logo">
                <span>Laboratório de Ciência de Dados</span>
            </a>

            <nav class="nav-links">
                <a href="{{ url_for('inicio') }}"
                class="{% if request.endpoint == 'inicio' %}active{% endif %}">
                    Início
                </a>

                <a href="{{ url_for('medidasTendCentral', time='Cleveland Cavaliers') }}"
                class="{% if request.endpoint == 'medidasTendCentral' %}active{% endif %}">
                    Medidas de Tendência Central
                </a>

                <a href="{{ url_for('assimetria', time='Cleveland Cavaliers') }}"
                class="{% if request.endpoint == 'assimetria' %}active{% endif %}">
                    Assimetria
                </a>

                <a href="{{ url_for('coefVariacao', time='Cleveland Cavaliers') }}"
                class="{% if request.endpoint == 'coefVariacao' %}active{% endif %}">
                    Coeficiente de Variação
                </a>

                <a href="{{ url_for('intervInterquartil', time='Cleveland Cavaliers') }}"
                class="{% if request.endpoint == 'intervInterquartil' %}active{% endif %}">
                    Intervalo Interquartil
                </a>
            </nav>

        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>Projeto desenvolvido com Flask e Python.</p>
    </footer>

</body>
</html>
