{% extends "base.html" %}

{% block title %}
Assimetria
{% endblock %}

{% block content %}

    <h1>Assimetria/Skewness</h1>

    <section class="selecao-times">
        <h2>Selecione uma equipe</h2>

        <div class="botoes-times">

            <a href="{{ url_for('assimetria', time='Cleveland Cavaliers') }}"
            class="botao-time {% if time_selecionado == 'Cleveland Cavaliers' %}selecionado{% endif %}">

                <img src="{{ url_for('static', filename='images/cavaliers.png') }}"
                    alt="Logo Cleveland Cavaliers">

                <span>Cleveland Cavaliers</span>
            </a>

            <a href="{{ url_for('assimetria', time='Brooklyn Nets') }}"
            class="botao-time {% if time_selecionado == 'Brooklyn Nets' %}selecionado{% endif %}">

                <img src="{{ url_for('static', filename='images/nets.png') }}"
                    alt="Logo Brooklyn Nets">

                <span>Brooklyn Nets</span>
            </a>

        </div>
    </section>


    <p>Teste</p>

    <div>
        <!-- Aqui serão exibidos os gráficos -->
    </div>

{% endblock %}
